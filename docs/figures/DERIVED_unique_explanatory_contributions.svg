<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 980 550" width="980" height="550"><rect width="980" height="550" fill="#ffffff"/><text x="42" y="48" fill="#11243a" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Unique model contribution, reconstructed</text><text x="42" y="77" fill="#66788a" font-size="15" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Incremental R² from reported t statistics and omnibus F; approximate</text><text x="44" y="150" fill="#11243a" font-size="17" font-weight="600" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Sense of community</text><rect x="300" y="128" width="554.0125" height="39" rx="5" fill="#0f837b"/><text x="925" y="154" fill="#11243a" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="end">19.27 pp</text><line x1="300" y1="183" x2="876" y2="183" stroke="#eff2f6" stroke-width="1"/><text x="44" y="250" fill="#11243a" font-size="17" font-weight="600" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Spirituality / purpose</text><rect x="300" y="228" width="75.9" height="39" rx="5" fill="#33435f"/><text x="925" y="254" fill="#11243a" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="end">2.64 pp</text><line x1="300" y1="283" x2="876" y2="283" stroke="#eff2f6" stroke-width="1"/><text x="44" y="350" fill="#11243a" font-size="17" font-weight="600" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Institutional integrity</text><rect x="300" y="328" width="4.3125" height="39" rx="5" fill="#c25f63"/><text x="925" y="354" fill="#11243a" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="end">0.15 pp</text><line x1="300" y1="383" x2="876" y2="383" stroke="#eff2f6" stroke-width="1"/><text x="43" y="471" fill="#66788a" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">pp = percentage points of full-sample R² lost when omitting one predictor.</text><text x="43" y="495" fill="#66788a" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Unique contributions do not sum to total R² because predictors share explained variation.</text><text x="43" y="519" fill="#66788a" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Author-supplied aggregate manuscript results • no causal/mediation identification claimed.</text></svg>
