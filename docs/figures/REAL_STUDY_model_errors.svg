<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 480" role="img" aria-label="Mean held-out RMSE for seven predictive models on a real private undergraduate survey"><rect width="930" height="480" fill="#ffffff"/><text x="36" y="42" fill="#182b44" font-family="Arial" font-weight="700" font-size="24">Held-out model prediction error | Real undergraduate survey</text><text x="36" y="70" fill="#64748b" font-family="Arial" font-size="14">25 matched folds (5 x 5); n = 152; smaller RMSE is better</text><text x="191" y="121" text-anchor="end" fill="#253c55" font-family="Arial" font-size="16">XGBoost</text><rect x="210" y="102" width="393.4342222222222" height="27" rx="4" fill="#187f87"/><text x="614.4342222222222" y="121" fill="#253c55" font-family="Arial" font-size="15">0.379</text><text x="191" y="168" text-anchor="end" fill="#253c55" font-family="Arial" font-size="16">Random Forest</text><rect x="210" y="149" width="394.26177777777775" height="27" rx="4" fill="#187f87"/><text x="615.2617777777778" y="168" fill="#253c55" font-family="Arial" font-size="15">0.380</text><text x="191" y="215" text-anchor="end" fill="#253c55" font-family="Arial" font-size="16">LightGBM</text><rect x="210" y="196" width="402.33407407407407" height="27" rx="4" fill="#637990"/><text x="623.3340740740741" y="215" fill="#253c55" font-family="Arial" font-size="15">0.388</text><text x="191" y="262" text-anchor="end" fill="#253c55" font-family="Arial" font-size="16">ElasticNet</text><rect x="210" y="243" width="412.59970370370365" height="27" rx="4" fill="#637990"/><text x="633.5997037037037" y="262" fill="#253c55" font-family="Arial" font-size="15">0.398</text><text x="191" y="309" text-anchor="end" fill="#253c55" font-family="Arial" font-size="16">Ridge</text><rect x="210" y="290" width="414.2402962962963" height="27" rx="4" fill="#637990"/><text x="635.2402962962963" y="309" fill="#253c55" font-family="Arial" font-size="15">0.399</text><text x="191" y="356" text-anchor="end" fill="#253c55" font-family="Arial" font-size="16">OLS</text><rect x="210" y="337" width="414.2496296296296" height="27" rx="4" fill="#637990"/><text x="635.2496296296297" y="356" fill="#253c55" font-family="Arial" font-size="15">0.399</text><text x="191" y="403" text-anchor="end" fill="#253c55" font-family="Arial" font-size="16">Mean-only baseline</text><rect x="210" y="384" width="531.5426666666666" height="27" rx="4" fill="#a9b6c6"/><text x="752.5426666666666" y="403" fill="#253c55" font-family="Arial" font-size="15">0.513</text><text x="36" y="470" fill="#64748b" font-family="Arial" font-size="13">Source: restricted original SPSS study; aggregates only. No external validation or inferential rank testing.</text></svg>
