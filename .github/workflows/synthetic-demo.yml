name: Synthetic ML and XAI end-to-end demonstration

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/synthetic-demo.yml"
  workflow_dispatch:

# Permission used only to publish clearly labeled, synthetic-only figures.
permissions:
  contents: write

jobs:
  synthetic-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Execute synthetic benchmark with Tree SHAP
        run: python -m examples.synthetic_demo --shap --n 240
      - name: Verify synthetic-only artifact labels and outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import json
          p=Path("demo_outputs")
          scores=pd.read_csv(p/"SYNTHETIC_model_metrics.csv")
          assert len(scores)==5, "Expected baseline plus four regressors"
          assert set(scores["provenance"])=={"SYNTHETIC_ONLY"}
          assert len(pd.read_csv(p/"SYNTHETIC_fold_metrics.csv"))==15
          manifest=json.loads((p/"SYNTHETIC_manifest.json").read_text())
          assert "SYNTHETIC" in manifest["provenance"]
          assert (p/"SYNTHETIC_models.png").stat().st_size>10000
          assert (p/"SYNTHETIC_SHAP"/"shap_summary.png").stat().st_size>10000
          print("Validated five model comparisons and synthetic SHAP.")
          PY
      - name: Publish verified synthetic figures in repository
        run: |
          mkdir -p docs/figures
          cp demo_outputs/SYNTHETIC_models.png docs/figures/SYNTHETIC_model_comparison.png
          cp demo_outputs/SYNTHETIC_SHAP/shap_summary.png docs/figures/SYNTHETIC_tree_shap.png
          cp demo_outputs/SYNTHETIC_model_metrics.csv docs/figures/SYNTHETIC_model_metrics.csv
          cp demo_outputs/SYNTHETIC_fold_metrics.csv docs/figures/SYNTHETIC_fold_metrics.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figures/SYNTHETIC_model_comparison.png docs/figures/SYNTHETIC_tree_shap.png docs/figures/SYNTHETIC_model_metrics.csv docs/figures/SYNTHETIC_fold_metrics.csv
          # docs/figures is explicitly unignored in .gitignore.
          if git diff --cached --quiet; then
            echo "Synthetic figures already current."
          else
            git commit -m "docs: publish generated synthetic ML and SHAP figures [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload clearly labeled synthetic research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SYNTHETIC_ONLY_Flourishing_ML_XAI_Demonstration
          path: demo_outputs/
          if-no-files-found: error
          retention-days: 30
